<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Collection — Kollect Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ---- Collection grid: 4 per row ---- */
    .coll-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    @media (max-width: 1000px) { .coll-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .coll-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

    .coll-tile {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      display: flex;
      flex-direction: column;
    }
    .coll-tile:hover,
    .coll-tile:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      outline: none;
    }
    .coll-tile-img {
      width: 100%;
      aspect-ratio: 5 / 7;
      object-fit: contain;
      background: rgba(0,0,0,0.25);
      display: block;
    }
    .coll-tile-body { padding: 10px 12px 12px; }
    .coll-tile-name {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.25;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .coll-tile-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.78rem;
    }

    /* ---- Popup (sits above the tab bar) ---- */
    .coll-modal {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.78);
      overflow-y: auto;
    }
    .coll-modal.open { display: flex; }
    .coll-modal-box {
      position: relative;
      width: 100%;
      max-width: 820px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      padding: 24px;
      border-radius: 16px;
      background: #14161d;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      color: #fff;
    }
    @media (max-width: 700px) {
      .coll-modal-box { grid-template-columns: 1fr; padding: 18px; gap: 16px; }
    }
    .coll-modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }
    .coll-modal-close:hover { background: rgba(255,255,255,0.22); }
    .coll-modal-img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
    }
    .coll-modal-info { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
    .coll-modal-name { font-size: 1.3rem; font-weight: 700; line-height: 1.25; padding-right: 30px; margin: 0; }
    .coll-details { list-style: none; margin: 0; padding: 0; font-size: 0.9rem; }
    .coll-details li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .coll-details li span:first-child { opacity: 0.65; }
    .coll-modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .coll-modal-actions .btn { width: 100%; }
    body.modal-open { overflow: hidden; }

    /* Top bar: borderless Log in / Log out button */
    .nav-auth {
      margin-left: auto;
      padding: 8px 4px;
      background: none;
      border: none;
      outline: none;
      box-shadow: none;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-auth:hover { color: #fff; }

    /* Bottom tab bar */
    body { padding-bottom: 100px; }
    .tabbar {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 460px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px 6px;
      border-radius: 28px;
      background: rgba(24, 28, 40, 0.92);
      border: 1px solid #2a2f3d;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,.5);
      z-index: 9000;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab.active { color: #22d3ee; }
    .tab-home {
      margin-top: -26px;
      color: #fff;
    }
    .tab-home .tab-bubble {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      border: 4px solid #0f1117;
      box-shadow: 0 0 18px rgba(139,92,246,.5);
    }
    .tab-home svg { width: 28px; height: 28px; }
    .tab-home.active { color: #fff; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">Kollect <span>Vault</span></a>
      <button type="button" class="nav-auth" id="navAuth">Log in</button>
    </div>
  </nav>

  <div class="container page-content">
    <h1 class="page-title">My Collection</h1>
    <p class="page-sub">Cards you’ve pulled. Tap a card to view details, then sell now or take the locked cash offer.</p>

    <div class="coll-grid" id="collectionGrid"></div>

    <p class="text-dim text-center mt-3" id="collectionNote" style="font-size:0.85rem">
      Loading your collection...
    </p>
  </div>

  <!-- Card popup -->
  <div class="coll-modal" id="cardModal" aria-hidden="true">
    <div class="coll-modal-box" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="coll-modal-close" id="modalClose" aria-label="Close">&times;</button>
      <img class="coll-modal-img" id="modalImg" src="" alt="" />
      <div class="coll-modal-info">
        <h2 class="coll-modal-name" id="modalName"></h2>
        <div id="modalBadge"></div>
        <ul class="coll-details" id="modalDetails"></ul>
        <div class="coll-modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">Kollect Vault &copy; 2026</div>
  </footer>

  <!-- Bottom tab bar -->
  <nav class="tabbar" id="tabbar">
    <a href="buy.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="12" height="16" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v12"/></svg>
      Packs
    </a>
    <a href="rewards.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8c-2 0-4-1-4-3s3-2 4 1c1-3 4-3 4-1s-2 3-4 3z"/></svg>
      Rewards
    </a>
    <a href="dashboard.html" class="tab tab-home">
      <span class="tab-bubble">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8v10H3z"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      Home
    </a>
    <a href="collection.html" class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="11" cy="12" r="3.5"/><path d="M11 9.5v1M11 13.5v1M8.5 12h1M12.5 12h1M21 9v2M21 13v2"/></svg>
      Vault
    </a>
    <a href="index.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Pulls
    </a>
  </nav>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-menu.js"></script>
<script>
(function () {
  var db = window.Kollect.db;
  var auth = window.Kollect.auth;

  // Top bar Log in / Log out button
  var navAuth = document.getElementById('navAuth');
  navAuth.addEventListener('click', function () {
    if (auth.currentUser) auth.signOut();
    else window.location.href = 'auth.html';
  });
  auth.onAuthStateChanged(function (u) {
    navAuth.textContent = u ? 'Log out' : 'Log in';
  });

  var grid = document.getElementById('collectionGrid');
  var note = document.getElementById('collectionNote');
  var modal = document.getElementById('cardModal');
  var modalImg = document.getElementById('modalImg');
  var modalName = document.getElementById('modalName');
  var modalBadge = document.getElementById('modalBadge');
  var modalDetails = document.getElementById('modalDetails');
  var modalActions = document.getElementById('modalActions');
  var modalClose = document.getElementById('modalClose');

  var unsubscribe = null;
  var cardsById = {};
  var openCardId = null;
  var lastFocus = null;

  var SELL_URL = 'https://www.kollect100.com/sell-with-us.php';
  var GRADE_URL = 'https://getgraded.co.uk';

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isRaw(c) {
    // Raw cards have no grade
    return !Number(c.grade);
  }

  function gradeLabel(c) {
    return isRaw(c) ? 'Raw' : escapeHtml(c.grader) + ' ' + escapeHtml(c.grade);
  }

  function badgeHtml(c) {
    return '<span class="badge ' + (c.grade === 10 ? 'badge-10' : 'badge-9') + '">' + gradeLabel(c) + '</span>';
  }

  function formatDate(ts) {
    try {
      if (ts && typeof ts.toDate === 'function') {
        return ts.toDate().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }
    } catch (e) {}
    return '';
  }

  /* ---------- Grid ---------- */
  function renderCards(cards) {
    // Only show cards still in the collection (not withdrawn, consigned or cashed)
    cards = cards.filter(function (c) {
      return !c.status || c.status === 'owned';
    });

    cardsById = {};
    cards.forEach(function (c) { cardsById[c.id] = c; });

    // If the open card is no longer owned, close the popup
    if (openCardId && !cardsById[openCardId]) closeModal();

    if (!cards.length) {
      grid.innerHTML = '';
      note.textContent = 'No cards yet. Buy a pack to start your collection.';
      return;
    }

    note.textContent = '';

    grid.innerHTML = cards.map(function (c) {
      var buyback = Number(c.buyback || 0).toFixed(2);
      return '<div class="coll-tile" tabindex="0" role="button" data-open="' + escapeHtml(c.id) + '" aria-label="View ' + escapeHtml(c.name) + '">' +
        '<img class="coll-tile-img" loading="lazy" src="' + escapeHtml(c.imageUrl) + '" alt="' + escapeHtml(c.name) + '" />' +
        '<div class="coll-tile-body">' +
          '<div class="coll-tile-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="coll-tile-meta">' +
            badgeHtml(c) +
            '<span class="text-dim">£' + buyback + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // Keep popup content fresh if it is open
    if (openCardId && cardsById[openCardId]) fillModal(cardsById[openCardId]);
  }

  /* ---------- Popup ---------- */
  function fillModal(c) {
    var buyback = Number(c.buyback || 0).toFixed(2);
    var pulled = formatDate(c.pulledAt);

    modalImg.src = c.imageUrl || '';
    modalImg.alt = c.name || '';
    modalName.textContent = c.name || '';
    modalBadge.innerHTML = badgeHtml(c);

    var rows = [];
    rows.push(['Grade', gradeLabel(c)]);
    rows.push(['Locked buyback', '£' + buyback]);
    if (pulled) rows.push(['Pulled', escapeHtml(pulled)]);
    if (c.set) rows.push(['Set', escapeHtml(c.set)]);
    if (c.rarity) rows.push(['Rarity', escapeHtml(c.rarity)]);
    if (c.certNumber) rows.push(['Cert #', escapeHtml(c.certNumber)]);

    modalDetails.innerHTML = rows.map(function (r) {
      return '<li><span>' + r[0] + '</span><span>' + r[1] + '</span></li>';
    }).join('');

    modalActions.innerHTML =
      '<button class="btn btn-success" data-action="cash" data-id="' + escapeHtml(c.id) + '" data-buyback="' + buyback + '">Cash £' + buyback + '</button>' +
      '<button class="btn btn-primary" data-action="consign" data-id="' + escapeHtml(c.id) + '">Sell with Kollect</button>' +
      (isRaw(c)
        ? '<button class="btn btn-primary" data-action="grade" data-id="' + escapeHtml(c.id) + '">Send for grading</button>'
        : '') +
      '<button class="btn btn-secondary" data-action="withdraw" data-id="' + escapeHtml(c.id) + '">Get physical card</button>';
  }

  function openModal(id) {
    var c = cardsById[id];
    if (!c) return;
    lastFocus = document.activeElement;
    openCardId = id;
    fillModal(c);
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    modalClose.focus();
  }

  function closeModal() {
    openCardId = null;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  grid.addEventListener('click', function (e) {
    var tile = e.target.closest('[data-open]');
    if (tile) openModal(tile.getAttribute('data-open'));
  });

  grid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var tile = e.target.closest('[data-open]');
    if (tile) {
      e.preventDefault();
      openModal(tile.getAttribute('data-open'));
    }
  });

  modalClose.addEventListener('click', closeModal);

  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal(); // click on backdrop
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openCardId) closeModal();
  });

  /* ---------- Actions (Cash out / Sell with Kollect / Send for grading / Get physical card) ---------- */
  modalActions.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;

    var user = auth.currentUser;
    if (!user) return;

    var action = btn.getAttribute('data-action');
    var cardId = btn.getAttribute('data-id');
    var cardRef = db.collection('users').doc(user.uid).collection('collection').doc(cardId);

    if (action === 'consign') {
      if (!confirm('Consign this card with Kollect? You will be taken to the Kollect sell page.')) return;

      btn.disabled = true;
      cardRef.update({
        status: 'consigned',
        consignedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function () {
        window.location.href = SELL_URL;
      }).catch(function (err) {
        btn.disabled = false;
        alert('Could not consign this card: ' + err.message);
      });
    }

    if (action === 'grade') {
      if (!confirm('Send this card for grading? It will leave your collection and you will be taken to Get Graded.')) return;

      var gc = cardsById[cardId] || {};
      btn.disabled = true;

      // Mark the card as sent for grading and log a request for the admin panel
      var batch = db.batch();
      batch.update(cardRef, {
        status: 'grading',
        gradingAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      batch.set(db.collection('gradingRequests').doc(user.uid + '_' + cardId), {
        uid: user.uid,
        cardId: cardId,
        name: gc.name || '',
        imageUrl: gc.imageUrl || '',
        category: gc.category || 'pokemon',
        market: Number(gc.market) || 0,
        buyback: Number(gc.buyback) || 0,
        status: 'pending',
        requestedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      batch.commit().then(function () {
        window.location.href = GRADE_URL;
      }).catch(function (err) {
        btn.disabled = false;
        alert('Could not send this card for grading: ' + err.message);
      });
    }

    if (action === 'withdraw') {
      if (!confirm('Withdraw this card as a physical card? It will move to Withdrawn on your dashboard.')) return;

      btn.disabled = true;
      cardRef.update({
        status: 'withdrawn',
        withdrawnAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(closeModal).catch(function (err) {
        btn.disabled = false;
        alert('Could not withdraw this card: ' + err.message);
      });
    }

    if (action === 'cash') {
      var amount = btn.getAttribute('data-buyback');
      if (!confirm('Cash out this card for £' + amount + '? This cannot be undone.')) return;

      btn.disabled = true;
      cardRef.update({
        status: 'cashed',
        cashedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(closeModal).catch(function (err) {
        btn.disabled = false;
        alert('Could not cash out this card: ' + err.message);
      });
    }
  });

  /* ---------- Data ---------- */
  auth.onAuthStateChanged(function (user) {
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }

    if (!user) {
      closeModal();
      grid.innerHTML = '';
      note.innerHTML = 'Please <a href="auth.html">sign in</a> to see your collection.';
      return;
    }

    note.textContent = 'Loading your collection...';

    unsubscribe = db.collection('users').doc(user.uid).collection('collection')
      .orderBy('pulledAt', 'desc')
      .onSnapshot(function (snap) {
        var cards = [];
        snap.forEach(function (doc) {
          var data = doc.data();
          data.id = doc.id;
          cards.push(data);
        });
        renderCards(cards);
      }, function (err) {
        console.error(err);
        note.textContent = 'Could not load your collection: ' + err.message;
      });
  });
})();
</script>
</body>
</html>
