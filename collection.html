<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Collection — Kollect Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">Kollect <span>Vault</span></a>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="auth.html">Sign In</a></li>
        <li><a href="buy.html">Buy Pack</a></li>
        <li><a href="pulls.html">Recent Pulls</a></li>
        <li><a href="collection.html" class="active">My Collection</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container page-content">
    <h1 class="page-title">My Collection</h1>
    <p class="page-sub">Cards you’ve pulled. Sell now or take the locked cash offer.</p>

    <div class="grid-3" id="collectionGrid"></div>

    <p class="text-dim text-center mt-3" id="collectionNote" style="font-size:0.85rem">
      Loading your collection...
    </p>
  </div>

  <footer>
    <div class="container">Kollect Vault &copy; 2026</div>
  </footer>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-menu.js"></script>
<script>
(function () {
  var db = window.Kollect.db;
  var auth = window.Kollect.auth;

  var grid = document.getElementById('collectionGrid');
  var note = document.getElementById('collectionNote');
  var unsubscribe = null;

  var SELL_URL = 'https://www.kollect100.com/sell-with-us.php';

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderCards(cards) {
    // Only show cards still in the collection (not withdrawn or consigned) (new)
    cards = cards.filter(function (c) {
      return !c.status || c.status === 'owned';
    });

    if (!cards.length) {
      grid.innerHTML = '';
      note.textContent = 'No cards yet. Buy a pack to start your collection.';
      return;
    }

    note.textContent = '';

    grid.innerHTML = cards.map(function (c) {
      var buyback = Number(c.buyback || 0).toFixed(2);

      // Raw cards have no grade (new)
      var gradeLabel = Number(c.grade) ? escapeHtml(c.grader) + ' ' + escapeHtml(c.grade) : 'Raw';

      return '<div class="card-item">' +
        '<img src="' + escapeHtml(c.imageUrl) + '" alt="' + escapeHtml(c.name) + '" />' +
        '<div class="card-item-body">' +
          '<div class="card-item-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="mb-2">' +
            '<span class="badge ' + (c.grade === 10 ? 'badge-10' : 'badge-9') + '">' +
              gradeLabel +
            '</span>' +
          '</div>' +
          '<p class="text-dim" style="font-size:0.82rem;margin-bottom:10px">Locked buyback: £' + buyback + '</p>' +
          '<div class="flex gap-2" style="flex-wrap:wrap">' +
            '<button class="btn btn-success btn-sm">Cash £' + buyback + '</button>' +
            '<button class="btn btn-primary btn-sm" data-action="consign" data-id="' + escapeHtml(c.id) + '">Sell with Kollect</button>' +
            '<button class="btn btn-secondary btn-sm" data-action="withdraw" data-id="' + escapeHtml(c.id) + '">Get physical card</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Sell with Kollect / Get physical card (new)
  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;

    var user = auth.currentUser;
    if (!user) return;

    var action = btn.getAttribute('data-action');
    var cardId = btn.getAttribute('data-id');
    var cardRef = db.collection('users').doc(user.uid).collection('collection').doc(cardId);

    if (action === 'consign') {
      if (!confirm('Consign this card with Kollect? You will be taken to the Kollect sell page.')) return;

      btn.disabled = true;
      cardRef.update({
        status: 'consigned',
        consignedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function () {
        window.location.href = SELL_URL;
      }).catch(function (err) {
        btn.disabled = false;
        alert('Could not consign this card: ' + err.message);
      });
    }

    if (action === 'withdraw') {
      if (!confirm('Withdraw this card as a physical card? It will move to Withdrawn on your dashboard.')) return;

      btn.disabled = true;
      cardRef.update({
        status: 'withdrawn',
        withdrawnAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function (err) {
        btn.disabled = false;
        alert('Could not withdraw this card: ' + err.message);
      });
    }
  });

  auth.onAuthStateChanged(function (user) {
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }

    if (!user) {
      grid.innerHTML = '';
      note.innerHTML = 'Please <a href="auth.html">sign in</a> to see your collection.';
      return;
    }

    note.textContent = 'Loading your collection...';

    unsubscribe = db.collection('users').doc(user.uid).collection('collection')
      .orderBy('pulledAt', 'desc')
      .onSnapshot(function (snap) {
        var cards = [];
        snap.forEach(function (doc) {
          var data = doc.data();
          data.id = doc.id;
          cards.push(data);
        });
        renderCards(cards);
      }, function (err) {
        console.error(err);
        note.textContent = 'Could not load your collection: ' + err.message;
      });
  });
})();
</script>
</body>
</html>
