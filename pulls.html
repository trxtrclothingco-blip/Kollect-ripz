<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent Pulls — Kollect Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Top bar: no burger, borderless Log in / Log out button */
    .burger, .nav-menu { display: none !important; }
    .nav-auth {
      margin-left: auto;
      padding: 8px 4px;
      background: none;
      border: none;
      outline: none;
      box-shadow: none;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-auth:hover { color: #fff; }

    /* Bottom tab bar */
    body { padding-bottom: 100px; }
    .tabbar {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 460px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px 6px;
      border-radius: 28px;
      background: rgba(24, 28, 40, 0.92);
      border: 1px solid #2a2f3d;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0,0,0,.5);
      z-index: 9000;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab.active { color: #22d3ee; }
    .tab-home {
      margin-top: -26px;
      color: #fff;
    }
    .tab-home .tab-bubble {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      border: 4px solid #0f1117;
      box-shadow: 0 0 18px rgba(139,92,246,.5);
    }
    .tab-home svg { width: 28px; height: 28px; }
    .tab-home.active { color: #fff; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">Kollect <span>Vault</span></a>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="auth.html">Sign In</a></li>
        <li><a href="buy.html">Buy Pack</a></li>
        <li><a href="pulls.html" class="active">Recent Pulls</a></li>
        <li><a href="collection.html">My Collection</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
      <button type="button" class="nav-auth" id="navAuth">Log in</button>
    </div>
  </nav>

  <div class="container page-content">
    <h1 class="page-title">Recent Pulls</h1>
    <p class="page-sub">Public feed of every pack opened. User data is hidden.</p>

    <div id="pullsList"></div>

    <p class="text-dim text-center mt-3" id="pullsNote" style="font-size:0.85rem">
      Loading recent pulls...
    </p>
  </div>

  <footer>
    <div class="container">Kollect Vault &copy; 2026</div>
  </footer>

  <!-- Bottom tab bar -->
  <nav class="tabbar" id="tabbar">
    <a href="buy.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="12" height="16" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v12"/></svg>
      Packs
    </a>
    <a href="rewards.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8c-2 0-4-1-4-3s3-2 4 1c1-3 4-3 4-1s-2 3-4 3z"/></svg>
      Rewards
    </a>
    <a href="dashboard.html" class="tab tab-home">
      <span class="tab-bubble">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8v10H3z"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      Home
    </a>
    <a href="collection.html" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="11" cy="12" r="3.5"/><path d="M11 9.5v1M11 13.5v1M8.5 12h1M12.5 12h1M21 9v2M21 13v2"/></svg>
      Vault
    </a>
    <a href="index.html" class="tab active" id="tabPulls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Pulls
    </a>
  </nav>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-menu.js"></script>
<script>
(function () {
  var db = window.Kollect.db;
  var auth = window.Kollect.auth;

  // Top bar Log in / Log out button
  var navAuth = document.getElementById('navAuth');
  navAuth.addEventListener('click', function () {
    if (auth.currentUser) auth.signOut();
    else window.location.href = 'auth.html';
  });
  auth.onAuthStateChanged(function (u) {
    navAuth.textContent = u ? 'Log out' : 'Log in';
  });

  var list = document.getElementById('pullsList');
  var note = document.getElementById('pullsNote');

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function timeAgo(ts) {
    if (!ts || !ts.toDate) return 'Just now';

    var secs = Math.floor((Date.now() - ts.toDate().getTime()) / 1000);
    if (secs < 60) return 'Just now';

    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');

    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');

    var days = Math.floor(hours / 24);
    if (days === 1) return 'Yesterday';
    return days + ' days ago';
  }

  db.collection('pulls')
    .orderBy('pulledAt', 'desc')
    .limit(50)
    .onSnapshot(function (snap) {
      var pulls = [];
      snap.forEach(function (doc) {
        pulls.push(doc.data());
      });

      if (!pulls.length) {
        list.innerHTML = '';
        note.textContent = 'No pulls yet. Be the first to open a pack.';
        return;
      }

      note.textContent = '';

      list.innerHTML = pulls.map(function (p) {
        return '<div class="pull-item">' +
          '<img src="' + escapeHtml(p.imageUrl) + '" alt="Card" />' +
          '<div style="flex:1">' +
            '<div class="pull-name">' + escapeHtml(p.name) + '</div>' +
            '<div class="pull-meta">' +
              '<span class="badge ' + (p.grade === 10 ? 'badge-10' : 'badge-9') + '">' +
                escapeHtml(p.grader) + ' ' + escapeHtml(p.grade) +
              '</span>' +
              '&nbsp;·&nbsp; ' + timeAgo(p.pulledAt) +
            '</div>' +
          '</div>' +
          '<div class="text-dim" style="font-size:0.85rem">£' + Number(p.market || 0).toFixed(2) + ' mkt</div>' +
        '</div>';
      }).join('');
    }, function (err) {
      console.error(err);
      note.textContent = 'Could not load pulls: ' + err.message;
    });
})();
</script>
</body>
</html>
