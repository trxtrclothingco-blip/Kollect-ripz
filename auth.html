<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Kollect Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .auth-box { max-width: 420px; margin: 40px auto; }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .auth-tab {
      flex: 1; padding: 12px; text-align: center; background: none; border: none;
      color: var(--dim); font-weight: 600; cursor: pointer; font-family: inherit;
      font-size: 0.95rem; border-bottom: 2px solid transparent;
    }
    .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .auth-error {
      background: rgba(239,68,68,0.12); color: #ef4444; border-radius: 8px;
      padding: 12px; margin-bottom: 16px; font-size: 0.9rem; display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">Kollect <span>Vault</span></a>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="buy.html">Buy Pack</a></li>
        <li><a href="pulls.html">Recent Pulls</a></li>
        <li><a href="collection.html">My Collection</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="auth.html" class="active">Sign In</a></li>
      </ul>
    </div>
  </nav>

  <div class="container page-content">
    <div class="auth-box card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">Sign In</button>
        <button type="button" class="auth-tab" data-tab="register">Create Account</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="formLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="loginEmail" required placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" required minlength="6" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign In</button>
      </form>

      <form id="formRegister" style="display:none">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" class="form-control" id="regName" required placeholder="Collector name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="regEmail" required placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="regPassword" required minlength="6" placeholder="Min 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary w-full">Create Account</button>
      </form>
    </div>
  </div>

  <footer>
    <div class="container">Kollect Vault &copy; 2026</div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/nav.js"></script>
  <script>
    var auth = firebase.auth();
    var db = firebase.firestore();

    function showError(msg) {
      var el = document.getElementById('authError');
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
    }

    document.querySelectorAll('.auth-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.auth-tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var isLogin = tab.getAttribute('data-tab') === 'login';
        document.getElementById('formLogin').style.display = isLogin ? '' : 'none';
        document.getElementById('formRegister').style.display = isLogin ? 'none' : '';
        showError('');
      });
    });

    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();
      showError('');
      auth.signInWithEmailAndPassword(
        document.getElementById('loginEmail').value.trim(),
        document.getElementById('loginPassword').value
      ).then(function () {
        window.location.href = 'dashboard.html';
      }).catch(function (err) {
        showError(err.message);
      });
    });

    document.getElementById('formRegister').addEventListener('submit', function (e) {
      e.preventDefault();
      showError('');
      var name = document.getElementById('regName').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var pass = document.getElementById('regPassword').value;

      auth.createUserWithEmailAndPassword(email, pass)
        .then(function (cred) {
          return cred.user.updateProfile({ displayName: name }).then(function () {
            return db.collection('users').doc(cred.user.uid).set({
              email: email,
              displayName: name,
              role: 'customer',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
        })
        .then(function () {
          window.location.href = 'dashboard.html';
        })
        .catch(function (err) {
          showError(err.message);
        });
    });
  </script>
</body>
</html>
